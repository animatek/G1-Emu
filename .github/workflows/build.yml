# Builds G1-Emu on the three systems it is meant to run on.
#
# No ROM is needed and none is ever fetched: the emulator only reads one when it runs, and this
# workflow never runs it. What it proves is that the code compiles and that the DSP tests pass,
# which is the part nobody can check by hand on three machines.
#
# The two dependencies are clones, not copies (see the README): Gearmulator for the DSP and 68k
# cores, and JUCE for the window and — off Linux — for audio and MIDI.

name: build

on:
  push:
    branches: [main]
    # A tag is what publishes a release: the same matrix builds, and the job at the end
    # collects the five packages and attaches them (see the release job).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (native ALSA/JACK)
            os: ubuntu-latest
            backend: native
            artifact: linux-x86_64-native
          - name: Linux (JUCE backend)
            os: ubuntu-latest
            backend: juce
            artifact: linux-x86_64-juce
          # The only other AArch64 machine available here. It runs the same JIT as Apple Silicon,
          # so it says whether a failure there is in the code we generate or in what macOS does
          # with it (W^X, icache). Free for public repositories.
          - name: Linux arm64 (native ALSA/JACK)
            os: ubuntu-24.04-arm
            backend: native
            artifact: linux-arm64-native
          # Universal, and with a deployment target set by hand: CMake otherwise inherits the
          # runner's own macOS (26 today), and the binary then refuses to start on anything
          # older — Ventura included, Apple Silicon or not. 11.0 is the floor for arm64.
          - name: macOS
            os: macos-latest
            backend: juce
            artifact: macos-universal
            # Quoted: the semicolon would otherwise end the command in the shell.
            extra_cmake: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          - name: Windows
            os: windows-latest
            backend: juce
            artifact: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          path: G1-Emu

      - name: Gearmulator (the 68k core)
        uses: actions/checkout@v4
        with:
          repository: joelanders/gearmulator-md-mm
          ref: mdmm-v0.1.0-alpha.13
          path: gearmulator-md-mm
          submodules: recursive

      # The DSP56300 core comes from upstream (docs/core-upgrade-plan.md). Pinned.
      - name: DSP56300 core (upstream)
        uses: actions/checkout@v4
        with:
          repository: dsp56300/dsp56300
          ref: da2ff232d965c9c3da587820baae38e2b29a5879
          path: dsp56300
          submodules: recursive

      - name: JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      # For the CLAP build of the plugin. Pinned: the first commit known to build against JUCE 8.0.12.
      - name: clap-juce-extensions
        uses: actions/checkout@v4
        with:
          repository: free-audio/clap-juce-extensions
          ref: 55525c9858d4b25687be7759a5e0f70eccef218e
          path: clap-juce-extensions
          submodules: recursive

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev libgl1-mesa-dev

      - name: Configure
        run: >
          cmake -B build -S G1-Emu -DCMAKE_BUILD_TYPE=Release
          -DGEARMULATOR_DIR=${{ github.workspace }}/gearmulator-md-mm
          -DG1_DSP56300_DIR=${{ github.workspace }}/dsp56300
          -DG1_JUCE_DIR=${{ github.workspace }}/JUCE
          -DG1_CLAP_DIR=${{ github.workspace }}/clap-juce-extensions
          -DG1_BACKEND=${{ matrix.backend }}
          ${{ matrix.extra_cmake }}

      # Four jobs, the runners' cores. A bare --parallel is make -j with no limit, and with LTO
      # and two plugins the Linux runners ran out of memory and were shut down.
      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Our own tests (label g1): the DSP core checks, which need no ROM, no sound card and no
      # MIDI. Gearmulator registers its own from its tree, but their binaries are EXCLUDE_FROM_ALL
      # here and never get built, so running everything would report them as failures.
      - name: Test
        run: ctest --test-dir build -C Release -L g1 --output-on-failure

      # The binaries, so somebody with a Mac or a Windows machine can try them without building
      # anything. No ROM is included, here or anywhere else: the emulator looks for one when it
      # runs and says where to put it (see the README). Nothing is signed or notarised, so macOS
      # and Windows will warn about an unidentified developer.
      #
      # An artifact is a zip and a zip loses the executable bit, so everything but Windows is
      # tarred first.
      # What the binary claims about itself is the whole point of the flags above, so it is
      # checked rather than assumed: both slices present, and a minimum macOS that is not the
      # runner's.
      # The AUs through Apple's own validator, installed where a host finds them: aumu (the
      # instrument) and aumf (G1-Emu FX), manufacturer Atek. No ROM here, so they play silence.
      - name: Validate the AUs (auval)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/app/plugin/g1plugin_artefacts/Release/AU/G1-Emu.component ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/app/plugin/g1pluginfx_artefacts/Release/AU/G1-Emu FX.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i atek || true
          auval -strict -v aumu G1Em Atek
          auval -strict -v aumf G1Fx Atek

      - name: Check the macOS binary
        if: runner.os == 'macOS'
        run: |
          for bin in build/app/g1run build/app/gui/g1gui_artefacts/Release/G1-Emu.app/Contents/MacOS/G1-Emu; do
            echo "== $bin"
            lipo -archs "$bin"
            vtool -show-build "$bin" | grep -E 'minos|platform'
            lipo -archs "$bin" | grep -q arm64 || { echo "no arm64 slice"; exit 1; }
            lipo -archs "$bin" | grep -q x86_64 || { echo "no x86_64 slice"; exit 1; }
            vtool -show-build "$bin" | grep -q 'minos 11' || { echo "wrong deployment target"; exit 1; }
          done

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp build/app/g1run package/
          cp -R build/app/gui/g1gui_artefacts/Release/G1-Emu* package/
          cp -R build/app/plugin/g1plugin_artefacts/Release/VST3/G1-Emu.vst3 package/
          cp -R build/app/plugin/g1plugin_artefacts/Release/CLAP/G1-Emu.clap package/
          cp -R "build/app/plugin/g1pluginfx_artefacts/Release/VST3/G1-Emu FX.vst3" package/
          cp -R "build/app/plugin/g1pluginfx_artefacts/Release/CLAP/G1-Emu FX.clap" package/
          if [ "$RUNNER_OS" = macOS ]; then
            cp -R build/app/plugin/g1plugin_artefacts/Release/AU/G1-Emu.component package/
            cp -R "build/app/plugin/g1pluginfx_artefacts/Release/AU/G1-Emu FX.component" package/
          fi
          cp G1-Emu/README.md G1-Emu/LICENSE package/
          tar -czf G1-Emu-${{ matrix.artifact }}.tar.gz -C package .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/app/Release/g1run.exe package/
          Copy-Item build/app/gui/g1gui_artefacts/Release/G1-Emu.exe package/
          Copy-Item -Recurse build/app/plugin/g1plugin_artefacts/Release/VST3/G1-Emu.vst3 package/
          Copy-Item build/app/plugin/g1plugin_artefacts/Release/CLAP/G1-Emu.clap package/
          Copy-Item -Recurse "build/app/plugin/g1pluginfx_artefacts/Release/VST3/G1-Emu FX.vst3" package/
          Copy-Item "build/app/plugin/g1pluginfx_artefacts/Release/CLAP/G1-Emu FX.clap" package/
          Copy-Item G1-Emu/README.md, G1-Emu/WINDOWS.md, G1-Emu/LICENSE package/

      # The installer, from the same files as the zip (packaging/windows/G1-Emu.iss). Named after
      # the tag on a release, after the commit otherwise.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev-' + '${{ github.sha }}'.Substring(0, 7) }
          & $iscc "/DAppVersion=$version" "/DPackageDir=$PWD\package" "/O$PWD" G1-Emu/packaging/windows/G1-Emu.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: G1-Emu-${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'package/*' || format('G1-Emu-{0}.tar.gz', matrix.artifact) }}
          if-no-files-found: error
          retention-days: 30

      # On its own, so the release job does not zip it with the rest.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: G1-Emu-${{ matrix.artifact }}-setup
          path: G1-Emu-${{ matrix.artifact }}-setup.exe
          if-no-files-found: error
          retention-days: 30

  # Only on a tag. It does not build anything: it takes what the matrix already produced,
  # so what people download is the very same binary the tests ran against.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: G1-Emu

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the packages
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          (cd artifacts/G1-Emu-windows-x86_64 && zip -r "$GITHUB_WORKSPACE/release/G1-Emu-windows-x86_64.zip" .)
          cp artifacts/G1-Emu-windows-x86_64-setup/G1-Emu-windows-x86_64-setup.exe release/
          ls -l release

      # Pre-release on purpose: it is a test build, and it must not look like a finished one.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "G1-Emu $GITHUB_REF_NAME" \
            --notes-file G1-Emu/docs/release-notes.md
